    <script>
        const noBtn = document.getElementById('no-btn');
        const yesBtn = document.getElementById('yes-btn');
        const proposalCard = document.getElementById('proposal-card');
        const successScreen = document.getElementById('success-screen');
        const canvas = document.getElementById('heart-canvas');
        const ctx = canvas.getContext('2d');

        // Function to move the 'No' button randomly when touched or hovered
        function moveNoButton(e) {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }

            const padding = 25;
            const btnWidth = noBtn.offsetWidth || 100;
            const btnHeight = noBtn.offsetHeight || 50;

            const maxX = window.innerWidth - btnWidth - padding;
            const maxY = window.innerHeight - btnHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            noBtn.style.position = 'fixed';
            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;
            noBtn.style.zIndex = '50';

            const randomRotate = (Math.random() - 0.5) * 24;
            noBtn.style.transform = `scale(0.95) rotate(${randomRotate}deg)`;
        }

        // Attach touch and pointer listeners for maximum responsiveness
        noBtn.addEventListener('mouseenter', moveNoButton);
        noBtn.addEventListener('touchstart', moveNoButton, { passive: false });
        noBtn.addEventListener('pointerdown', moveNoButton);
        noBtn.addEventListener('click', moveNoButton);

        function acceptProposal() {
            proposalCard.style.opacity = '0';
            proposalCard.style.transform = 'scale(0.8)';

            setTimeout(() => {
                proposalCard.classList.add('hidden');
                successScreen.classList.remove('hidden');
                triggerHeartExplosion();
            }, 300);
        }

        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class HeartParticle {
            constructor(isExplosion = false) {
                this.isExplosion = isExplosion;
                this.reset();
            }

            reset() {
                this.x = this.isExplosion ? window.innerWidth / 2 : Math.random() * canvas.width;
                this.y = this.isExplosion ? window.innerHeight / 2 : canvas.height + Math.random() * 80;
                
                this.size = Math.random() * 20 + 12;
                
                if (this.isExplosion) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 14 + 5;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                } else {
                    this.vx = (Math.random() - 0.5) * 1.5;
                    this.vy = -(Math.random() * 2 + 1);
                }

                this.alpha = Math.random() * 0.7 + 0.3;
                this.rot = Math.random() * Math.PI * 2;
                this.rotSpeed = (Math.random() - 0.5) * 0.05;
                
                const heartIcons = ['💖', '💕', '💋', '❤️', '😘', '✨'];
                this.char = heartIcons[Math.floor(Math.random() * heartIcons.length)];
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.rot += this.rotSpeed;

                if (this.isExplosion) {
                    this.vy += 0.16; // Gravity
                    this.alpha -= 0.009; // Fade
                }

                if (!this.isExplosion && (this.y < -50 || this.alpha <= 0)) {
                    this.reset();
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.font = `${this.size}px sans-serif`;
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rot);
                ctx.fillText(this.char, -this.size / 2, this.size / 2);
                ctx.restore();
            }
        }

        function initParticles() {
            resizeCanvas();
            particles = [];
            for (let i = 0; i < 30; i++) {
                particles.push(new HeartParticle(false));
            }
        }

        function triggerHeartExplosion() {
            for (let i = 0; i < 130; i++) {
                particles.push(new HeartParticle(true));
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();

                if (p.isExplosion && p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(animateParticles);
        }

        window.addEventListener('resize', resizeCanvas);

        window.onload = function() {
            initParticles();
            animateParticles();
        };
    </script>
